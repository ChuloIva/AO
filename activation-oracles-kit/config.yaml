# Activation Oracles Research Kit - Configuration

# Default model settings
default_model: "Qwen/Qwen3-1.7B"
use_8bit_quantization: False

# Generation settings
generation:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9
  do_sample: true

# World LLM defaults
world_llm:
  default_model: "moonshotai/kimi-k2:free"
  temperature: 1.0
  max_tokens: 256

# Activation capture settings
activation_capture:
  default_layer_percent: 50  # Middle layer
  cache_activations: true
  injection_layer: 1
  steering_coefficient: 1.0

# Data directories
data:
  traces_dir: "data/traces"
  activations_dir: "data/activations"
  exports_dir: "data/exports"

# UI settings
ui:
  page_title: "Activation Oracles Research Kit"
  page_icon: "🧠"
  layout: "wide"
  
# Logging
logging:
  level: "INFO"
  log_file: "activation_oracles.log"

# ROCm configuration (for AMD GPUs)
rocm:
  # Path to ROCm installation (leave empty for auto-detection)
  rocm_home: ""
  # Enable automatic ROCm environment setup
  auto_configure: true
  # GPU architecture (gfx1100 for RX 7700 XT, gfx90a for MI200 series, etc.)
  gpu_arch: "gfx1100"
  # GFX version override (11.0.0 for RDNA 3)
  gfx_version: "11.0.0"
